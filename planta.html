<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planta da fábrica</title>
<style>
:root{--bg:#eef2f5;--bar:#ffffff;--ink:#0d1a31;--muted:#3b4c68;--acc:#0a7ea4;--line:#c9d3de;--btn:#0d1a31;--btn-ink:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--bar:#18233a;--ink:#e9f1fb;--muted:#a6b8d4;--acc:#5ce1ff;--line:#2c3a56;--btn:#5ce1ff;--btn-ink:#06101f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--bar:#18233a;--ink:#e9f1fb;--muted:#a6b8d4;--acc:#5ce1ff;--line:#2c3a56;--btn:#5ce1ff;--btn-ink:#06101f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#bar,#bar2{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;flex:none}
#bar a{color:var(--acc);font-weight:700;text-decoration:none}
button,select,input{font:inherit;color:var(--ink)}
button{background:var(--btn);color:var(--btn-ink);border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;flex:none}
button.on{outline:3px solid var(--acc)}
select,input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;touch-action:none;display:block}
#msg{position:absolute;left:10px;right:10px;top:10px;background:var(--bar);border:1px solid var(--acc);border-radius:10px;padding:10px 12px;display:none}
#sel{display:flex;gap:8px;padding:10px;background:var(--bar);border-top:1px solid var(--line);flex:none}
#sel input{flex:1}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header id="bar">
  <a href="index.html" aria-label="Voltar">←</a>
  <select id="lista" aria-label="Buscar máquina"><option value="">Buscar máquina…</option></select>
  <button id="bLogin" hidden>Entrar com Google</button>
  <button id="bEdit" hidden>Editar</button>
  <button id="bAdd" hidden>+ Máquina</button>
  <button id="bLin" hidden>Editar linhas</button>
  <button id="bOpen">Abrir arquivo</button>
  <button id="bSend" hidden>Enviar planta</button>
  <button id="bDxf">Exportar DXF</button>
  <button id="bJson">Backup JSON</button>
</header>
<header id="bar2" hidden>
  <button id="tSel">Selecionar</button><button id="tMov">Mover</button><button id="tLin">Linha</button><button id="tMed">Medir</button><button id="tEsc">Escala</button><button id="tDel">Apagar</button><button id="tUnd">Desfazer</button>
</header>
<div id="stage"><canvas id="cv"></canvas><div id="msg" role="status"></div></div>
<div id="sel" hidden>
  <input id="nome" placeholder="Nome da máquina" aria-label="Nome da máquina">
  <button id="bDel">Excluir</button>
  <button id="bOk">Fechar</button>
</div>
<input type="file" id="fil" accept=".dxf,.bin,.json" hidden>

<script>
// Configuração do Firebase (pública por natureza; a segurança está nas regras do Firestore). Use null para o modo local.
var FIREBASE={apiKey:"AIzaSyDhep4vqCM__2NGqiQKsa9ju4LEPJ9v_kQ",authDomain:"mecanica-e41e7.firebaseapp.com",projectId:"mecanica-e41e7",storageBucket:"mecanica-e41e7.firebasestorage.app",messagingSenderId:"1025308484975",appId:"1:1025308484975:web:6dcc3285c40496ba31f49a"};

// PURE-START
function colorDe(n){var m=/([0-9A-Fa-f]{6})$/.exec(n||"");return m?"#"+m[1]:"#222222"}
function parseDXF(t,mk){
  var P={},T=[],Rw={},b=[1e18,1e18,-1e18,-1e18],pos=0,n=t.length,inE=false,o=null;
  function raw(c,a){var r=Rw[c]||(Rw[c]={lens:[],pts:[]});r.lens.push(a.length/2);for(var i=0;i<a.length;i++)r.pts.push(Math.round(a[i]*100))}
  function ln(){var e=t.indexOf("\n",pos);if(e<0)e=n;var s=t.slice(pos,e);pos=e+1;return s.trim()}
  function pt(x,y){if(x<b[0])b[0]=x;if(y<b[1])b[1]=y;if(x>b[2])b[2]=x;if(y>b[3])b[3]=y}
  function flush(){
    if(!o)return;var ty=o.t,p,i;
    if(ty==="TEXT"||ty==="MTEXT"){if(o[1]!=null)T.push([+o[10],+o[20],+o[40]||1,+o[50]||0,o[1].replace(/\\P/g," ")]);return}
    var c=colorDe(o[8]);p=P[c]||(P[c]=mk());
    if(ty==="LINE"){p.moveTo(+o[10],+o[20]);p.lineTo(+o[11],+o[21]);pt(+o[10],+o[20]);pt(+o[11],+o[21]);raw(c,[+o[10],+o[20],+o[11],+o[21]])}
    else if(ty==="LWPOLYLINE"&&o.X.length>1){
      for(i=0;i<o.X.length;i++){i?p.lineTo(o.X[i],o.Y[i]):p.moveTo(o.X[i],o.Y[i]);pt(o.X[i],o.Y[i])}
      var A=[];for(i=0;i<o.X.length;i++)A.push(o.X[i],o.Y[i]);
      if((+o[70]||0)&1){p.closePath();A.push(o.X[0],o.Y[0])}
      raw(c,A)}
    else if(ty==="CIRCLE"||ty==="ARC"){
      var x=+o[10],y=+o[20],r=+o[40],a=ty==="ARC"?(+o[50])*Math.PI/180:0,e=ty==="ARC"?(+o[51])*Math.PI/180:Math.PI*2;
      p.moveTo(x+r*Math.cos(a),y+r*Math.sin(a));p.arc(x,y,r,a,e);pt(x-r,y-r);pt(x+r,y+r);
      if(e<=a)e+=Math.PI*2;var A=[],q;for(q=0;q<=36;q++)A.push(x+r*Math.cos(a+(e-a)*q/36),y+r*Math.sin(a+(e-a)*q/36));raw(c,A)}
  }
  while(pos<n){
    var k=ln(),v=ln();
    if(k==="0"){flush();o=null;if(v==="ENDSEC"&&inE)break;if(inE)o={t:v,X:[],Y:[]}}
    else if(k==="2"&&v==="ENTITIES")inE=true;
    else if(o){if(k==="10")o.X.push(+v);else if(k==="20")o.Y.push(+v);if(o[k]==null)o[k]=v}
  }
  flush();
  return {paths:P,texts:T,b:b,raw:Rw};
}
function ins(r,x,y){return x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3]}
function oculto(d,a,b,c,e){for(var i=0;i<d.length;i++){var r=d[i];if(ins(r,a,b)&&ins(r,c,e))return true}return false}
function parseBIN(buf,mk,del,box){
  var dv=new DataView(buf),hl=dv.getUint32(0,true),h=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,hl))),o=4+hl,P={},q=h.q,ext={},cnt=0,nd=del&&del.length;
  h.groups.forEach(function(g){
    var lens=new Uint32Array(buf,o,g.n);o+=4*g.n;var pts=new Int32Array(buf,o,g.p*2);o+=8*g.p;
    var p=mk(),k=0,i,j,px,py,pen;
    for(i=0;i<g.n;i++){pen=false;for(j=0;j<lens[i];j++,k+=2){var x=pts[k]/q,y=pts[k+1]/q;
      if(!box&&!nd)j?p.lineTo(x,y):p.moveTo(x,y);
      else if(j){var hid=nd&&oculto(del,px,py,x,y);
        if(box){if(!hid&&ins(box,px,py)&&ins(box,x,y)){(ext[g.c]||(ext[g.c]=[])).push(px,py,x,y);cnt++}}
        else if(!hid){if(!pen)p.moveTo(px,py);p.lineTo(x,y);pen=true}else pen=false}
      px=x;py=y}}
    P[g.c]=p});
  return {paths:P,texts:h.texts,b:h.bounds,buf:buf,ext:ext,n:cnt};
}
function toBIN(d){
  var cs=Object.keys(d.raw),hb=new TextEncoder().encode(JSON.stringify({q:100,bounds:d.b,texts:d.texts,groups:cs.map(function(c){return {c:c,n:d.raw[c].lens.length,p:d.raw[c].pts.length/2}})})),
      hl=Math.ceil(hb.length/4)*4,tot=4+hl;
  cs.forEach(function(c){tot+=4*d.raw[c].lens.length+4*d.raw[c].pts.length});
  var buf=new ArrayBuffer(tot),o=4+hl;new DataView(buf).setUint32(0,hl,true);
  new Uint8Array(buf,4,hb.length).set(hb);new Uint8Array(buf,4+hb.length,hl-hb.length).fill(32);
  cs.forEach(function(c){var r=d.raw[c];new Uint32Array(buf,o,r.lens.length).set(r.lens);o+=4*r.lens.length;new Int32Array(buf,o,r.pts.length).set(r.pts);o+=4*r.pts.length});
  return buf;
}
// PURE-END

var $=function(i){return document.getElementById(i)};
var cv=$("cv"),cx=cv.getContext("2d"),W=0,H=0,DPR=1,D=null,V={s:1,x:0,y:0},base=null,fit=1,tm,st,
    M=[],sel=null,mode="ver",addMode=false,canEdit=true,DB=null,logado=false,hov=null,drag=null,pts={},g0=null,
    ED={del:[],add:[],esc:0},selE={},lin=false,tool="sel",box=null,mv=null,off=null,cur=[],mp=[],pilha=[],se;
var dicas={sel:"Arraste para selecionar uma área (linhas da planta e desenhadas). Toque numa linha desenhada para escolhê-la.",mov:"Com algo selecionado, arraste para mover.",lin:"Toque para marcar pontos. Toque em Linha de novo para concluir.",med:"Toque em dois pontos para medir.",esc:"Toque em dois pontos de distância conhecida."};
function mk(){return new Path2D()}
function aviso(t){var m=$("msg");m.textContent=t||"";m.style.display=t?"block":"none"}
function w2s(x,y){return [V.s*x+V.x,V.y-V.s*y]}
function s2w(x,y){return [(x-V.x)/V.s,(V.y-y)/V.s]}

function size(){
  var r=cv.parentNode.getBoundingClientRect();DPR=window.devicePixelRatio||1;W=r.width;H=r.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+"px";cv.style.height=H+"px";
}
function fitView(){
  var b=D.b,bw=b[2]-b[0],bh=b[3]-b[1];V.s=fit=Math.min(W/bw,H/bh)*0.95;
  V.x=W/2-V.s*(b[0]+b[2])/2;V.y=H/2+V.s*(b[1]+b[3])/2;
}
function renderBase(){
  if(!D)return;
  var c=document.createElement("canvas");c.width=cv.width;c.height=cv.height;
  var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);
  g.setTransform(DPR*V.s,0,0,-DPR*V.s,DPR*V.x,DPR*V.y);g.lineWidth=1/V.s;
  for(var col in D.paths){g.strokeStyle=col;g.stroke(D.paths[col])}
  g.fillStyle="#111";
  D.texts.forEach(function(t){
    if(t[2]*V.s<3)return;
    g.save();g.translate(t[0],t[1]);g.rotate(t[3]*Math.PI/180);g.scale(1,-1);g.font=t[2]+"px sans-serif";g.fillText(t[4],0,0);g.restore()});
  base={c:c,s:V.s,x:V.x,y:V.y};draw();
}
function later(){clearTimeout(tm);tm=setTimeout(renderBase,160)}
function draw(){
  cx.setTransform(1,0,0,1,0,0);cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
  if(base){var k=V.s/base.s;cx.setTransform(k,0,0,k,DPR*(V.x-k*base.x),DPR*(V.y-k*base.y));cx.drawImage(base.c,0,0)}
  drawED();
  cx.setTransform(DPR,0,0,DPR,0,0);cx.font="600 13px system-ui,sans-serif";cx.textBaseline="middle";
  M.forEach(function(m){
    var p=w2s(m.x,m.y),on=m===sel;
    cx.beginPath();cx.arc(p[0],p[1],on?10:7,0,7);cx.fillStyle=on?"#e4572e":"#0a7ea4";cx.fill();
    cx.lineWidth=2;cx.strokeStyle="#fff";cx.stroke();
    var near=hov&&Math.hypot(hov[0]-p[0],hov[1]-p[1])<40;
    if(on||near||V.s>fit*3){
      var tw=cx.measureText(m.nome).width+14,bx=p[0]-tw/2,by=p[1]-34;
      cx.fillStyle="rgba(13,26,49,.92)";cx.beginPath();cx.roundRect?cx.roundRect(bx,by,tw,22,6):cx.rect(bx,by,tw,22);cx.fill();
      cx.fillStyle="#fff";cx.textAlign="center";cx.fillText(m.nome,p[0],by+11);cx.textAlign="left"}
  });
}
function usar(d){D=d;base=null;fitView();if(ED.del.length)refazBase();else renderBase();aviso("")}

// edição de linhas
function js(){return JSON.stringify(ED,function(k,v){return k==="P"?undefined:v})}
function pathDe(it){var P=new Path2D(),p=it.p,i;
  if(it.k==="s")for(i=0;i+3<p.length;i+=4){P.moveTo(p[i],p[i+1]);P.lineTo(p[i+2],p[i+3])}
  else for(i=0;i+1<p.length;i+=2)i?P.lineTo(p[i],p[i+1]):P.moveTo(p[i],p[i+1]);
  return P}
function drawED(){
  cx.setTransform(DPR*V.s,0,0,-DPR*V.s,DPR*V.x,DPR*V.y);cx.lineJoin="round";
  ED.add.forEach(function(it,i){var on=selE[i];cx.strokeStyle=on?"#e4572e":it.c;cx.lineWidth=(on?2.4:1.4)/V.s;
    if(!it.P)it.P=pathDe(it);
    if(on&&off){cx.save();cx.translate(off[0],off[1]);cx.stroke(it.P);cx.restore()}else cx.stroke(it.P)});
  cx.strokeStyle="#e4572e";cx.lineWidth=1.6/V.s;
  if(cur.length){cx.beginPath();cx.moveTo(cur[0],cur[1]);for(var i=2;i<cur.length;i+=2)cx.lineTo(cur[i],cur[i+1]);
    if(hov){var w=s2w(hov[0],hov[1]);cx.lineTo(w[0],w[1])}cx.stroke()}
  if(mp.length){cx.beginPath();mp.forEach(function(q,i){i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]);cx.moveTo(q[0],q[1])});
    cx.moveTo(mp[0][0],mp[0][1]);if(mp[1])cx.lineTo(mp[1][0],mp[1][1]);cx.stroke()}
  cx.setTransform(DPR,0,0,DPR,0,0);
  if(box){var a=w2s(box[0],box[1]),b=w2s(box[2],box[3]);cx.setLineDash([6,4]);cx.lineWidth=1.5;cx.strokeStyle="#0a7ea4";cx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);cx.setLineDash([])}
}
function snap(){pilha.push(js());if(pilha.length>20)pilha.shift()}
function saveED(){
  var j=js();if(j.length>900000){aviso("Edições grandes demais para salvar. Desfaça ou apague algo.");draw();return}
  if(DB){clearTimeout(se);se=setTimeout(function(){DB.setDoc(DB.doc(DB.fs,"planta","edicoes"),{j:j,em:Date.now()}).catch(function(){aviso("Sem permissão para salvar as linhas.")})},400)}
  else try{localStorage.setItem("planta_edicoes",j)}catch(e){}
  draw()}
function refazBase(){if(!D)return;if(!D.buf)D.buf=toBIN(D);D.paths=parseBIN(D.buf,mk,ED.del).paths;renderBase()}
function aplicaED(a){a.del=a.del||[];a.add=a.add||[];var m=JSON.stringify(a.del)!==JSON.stringify(ED.del);ED=a;selE={};if(m&&D)refazBase();else draw()}
function desfazer(){if(!pilha.length){aviso("Nada para desfazer.");return}
  var a=JSON.parse(pilha.pop()),m=JSON.stringify(a.del)!==JSON.stringify(ED.del);ED=a;selE={};if(m)refazBase();saveED()}
function nsel(){return Object.keys(selE).length}
function bbox(it){var p=it.p,r=[1e18,1e18,-1e18,-1e18],k;for(k=0;k<p.length;k+=2){if(p[k]<r[0])r[0]=p[k];if(p[k+1]<r[1])r[1]=p[k+1];if(p[k]>r[2])r[2]=p[k];if(p[k+1]>r[3])r[3]=p[k+1]}return r}
function dseg(w,a,b,c,d){var dx=c-a,dy=d-b,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((w[0]-a)*dx+(w[1]-b)*dy)/l)):0;return Math.hypot(w[0]-a-t*dx,w[1]-b-t*dy)}
function pega(w){var best=-1,bd=14/V.s;
  ED.add.forEach(function(it,i){var p=it.p,st=it.k==="s"?4:2,k;for(k=0;k+3<p.length;k+=st){var d=dseg(w,p[k],p[k+1],p[k+2],p[k+3]);if(d<bd){bd=d;best=i}}});return best}
function caixa(r){
  var i,e;selE={};
  if(D){if(!D.buf)D.buf=toBIN(D);e=parseBIN(D.buf,mk,ED.del,r);
    if(e.n>30000){aviso("Área grande demais ("+e.n+" segmentos). Selecione uma região menor.");return}}
  snap();
  ED.add.forEach(function(it,i){var b=bbox(it);if(b[0]>=r[0]&&b[1]>=r[1]&&b[2]<=r[2]&&b[3]<=r[3])selE[i]=true});
  if(e&&e.n){for(var c in e.ext){ED.add.push({c:c,k:"s",p:e.ext[c]});selE[ED.add.length-1]=true}ED.del.push(r);refazBase()}
  saveED();aviso(nsel()?"Selecionado. Use Mover ou Apagar.":"Nada nessa área.")}
function apagar(){if(!nsel()){aviso("Selecione algo primeiro.");return}
  snap();ED.add=ED.add.filter(function(_,i){return !selE[i]});selE={};saveED()}
function fechaLinha(){if(cur.length>=4){snap();ED.add.push({c:"#000000",k:"p",p:cur});saveED()}cur=[]}
function setTool(t){if(tool==="lin")fechaLinha();tool=t;mp=[];box=null;mv=null;off=null;aviso(dicas[t]);ui();draw()}
function medida(){
  var d=Math.hypot(mp[0][0]-mp[1][0],mp[0][1]-mp[1][1]);
  if(tool==="esc"){var m=parseFloat((prompt("Quantos metros tem essa distância na realidade?")||"").replace(",","."));
    if(m>0&&d>0){snap();ED.esc=m/d;saveED();aviso("Escala definida. Agora a medida mostra metros.")}}
  else aviso("Distância: "+(ED.esc?(d*ED.esc).toFixed(2).replace(".",",")+" m":d.toFixed(2).replace(".",",")+" unidades (sem escala: use Escala)"))}
function fimLin(o){
  var w=s2w(o.x,o.y),r2=function(v){return Math.round(v*100)/100};
  if(tool==="sel"){
    if(box&&o.mv){var b=box;box=null;caixa([Math.min(b[0],b[2]),Math.min(b[1],b[3]),Math.max(b[0],b[2]),Math.max(b[1],b[3])])}
    else{box=null;selE={};var i=pega(w);if(i>=0)selE[i]=true}}
  else if(tool==="mov"){
    if(mv&&off&&o.mv){snap();ED.add.forEach(function(it,i){if(selE[i]){for(var k=0;k<it.p.length;k+=2){it.p[k]=r2(it.p[k]+off[0]);it.p[k+1]=r2(it.p[k+1]+off[1])}delete it.P}});saveED()}
    mv=null;off=null}
  else if(!o.mv){
    if(tool==="lin")cur.push(r2(w[0]),r2(w[1]));
    else{if(mp.length>1)mp=[];mp.push(w);if(mp.length===2)medida()}}
}

// máquinas
function hit(x,y){
  for(var i=M.length-1;i>=0;i--){var p=w2s(M[i].x,M[i].y);if(Math.hypot(p[0]-x,p[1]-y)<20)return M[i]}
  return null}
function editando(){return canEdit&&mode==="editar"}
function ui(){
  $("bLogin").hidden=!FIREBASE;$("bEdit").hidden=!canEdit;$("bEdit").textContent=mode==="editar"?"Concluir":"Editar";
  $("bAdd").hidden=!editando();$("bLin").hidden=!canEdit;$("bLin").textContent=lin?"Concluir linhas":"Editar linhas";$("bar2").hidden=!lin;
  ["sel","mov","lin","med","esc"].forEach(function(t){$("t"+t[0].toUpperCase()+t.slice(1)).classList.toggle("on",tool===t)});$("bSend").hidden=!(FIREBASE&&canEdit);$("bAdd").classList.toggle("on",addMode);
  $("sel").hidden=!sel;
  if(sel){$("nome").value=sel.nome;$("nome").readOnly=!editando();$("bDel").hidden=!editando()}
}
function lista(){
  var s=$("lista");s.innerHTML="<option value=''>Buscar máquina…</option>";
  M.slice().sort(function(a,b){return a.nome.localeCompare(b.nome)}).forEach(function(m){
    var o=document.createElement("option");o.value=m.id;o.textContent=m.nome;s.appendChild(o)});
}
function save(){
  if(DB){clearTimeout(st);st=setTimeout(function(){
    DB.setDoc(DB.doc(DB.fs,"planta","maquinas"),{lista:M,em:Date.now()}).catch(function(){aviso("Sem permissão para salvar.")})},400)}
  else try{localStorage.setItem("planta_maquinas",JSON.stringify(M))}catch(e){}
}
function escolher(m){sel=m;ui();draw()}

// gestos
function pos(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function zoomEm(x,y,f){
  var w=s2w(x,y),ns=Math.min(Math.max(V.s*f,fit*0.5),fit*400);V.s=ns;V.x=x-ns*w[0];V.y=y+ns*w[1]}
cv.addEventListener("pointerdown",function(e){
  cv.setPointerCapture(e.pointerId);var p=pos(e);pts[e.pointerId]={x:p[0],y:p[1],x0:p[0],y0:p[1],mv:false};
  var ids=Object.keys(pts);
  if(ids.length===1){
    if(lin){var w0=s2w(p[0],p[1]);if(tool==="sel")box=[w0[0],w0[1],w0[0],w0[1]];else if(tool==="mov"&&nsel())mv=w0;drag=null}
    else{var h=editando()?hit(p[0],p[1]):null;drag=h||null;if(drag)sel=drag}}
  else{drag=null;box=null;mv=null;var a=pts[ids[0]],b=pts[ids[1]];g0={d:Math.hypot(a.x-b.x,a.y-b.y),s:V.s,x:V.x,y:V.y,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}
});
cv.addEventListener("pointermove",function(e){
  var p=pos(e);hov=p;var o=pts[e.pointerId],ids=Object.keys(pts);
  if(!o){draw();return}
  var dx=p[0]-o.x,dy=p[1]-o.y;o.x=p[0];o.y=p[1];if(Math.hypot(p[0]-o.x0,p[1]-o.y0)>6)o.mv=true;
  if(ids.length===1){
    if(drag&&o.mv){var w=s2w(p[0],p[1]);drag.x=Math.round(w[0]*100)/100;drag.y=Math.round(w[1]*100)/100}
    else if(box){var w1=s2w(p[0],p[1]);box[2]=w1[0];box[3]=w1[1]}
    else if(mv){var w2=s2w(p[0],p[1]);off=[w2[0]-mv[0],w2[1]-mv[1]]}
    else if(!drag){V.x+=dx;V.y+=dy;later()}
  }else if(ids.length===2&&g0){
    var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    V.s=g0.s;V.x=g0.x;V.y=g0.y;zoomEm(g0.mx,g0.my,d/g0.d);V.x+=mx-g0.mx;V.y+=my-g0.my;later()}
  draw();
});
function fim(e){
  var o=pts[e.pointerId];if(!o)return;delete pts[e.pointerId];g0=null;
  if(Object.keys(pts).length)return;
  if(lin){fimLin(o);drag=null;ui();draw();return}
  if(drag&&o.mv){save();lista()}
  else if(!o.mv){
    var h=hit(o.x,o.y);
    if(h)escolher(h);
    else if(addMode&&editando()){
      var n=prompt("Nome da máquina?");
      if(n&&n.trim()){var w=s2w(o.x,o.y),m={id:Date.now().toString(36),nome:n.trim(),x:Math.round(w[0]*100)/100,y:Math.round(w[1]*100)/100};
        M.push(m);addMode=false;save();lista();escolher(m)}}
    else if(sel){sel=null;ui();draw()}
  }
  drag=null;ui();draw();
}
cv.addEventListener("pointerup",fim);cv.addEventListener("pointercancel",fim);
cv.addEventListener("pointerleave",function(e){if(e.pointerType==="mouse"){hov=null;draw()}});
cv.addEventListener("wheel",function(e){e.preventDefault();var p=pos(e);zoomEm(p[0],p[1],Math.exp(-e.deltaY*0.0015));draw();later()},{passive:false});
window.addEventListener("resize",function(){size();if(D){base=null;fitView();renderBase()}});

// botões
$("lista").onchange=function(){
  var m=M.filter(function(x){return x.id===this.value},this)[0];if(!m)return;
  V.s=Math.max(V.s,fit*4);V.x=W/2-V.s*m.x;V.y=H/2+V.s*m.y;escolher(m);renderBase()};
$("bEdit").onclick=function(){lin=false;mode=mode==="editar"?"ver":"editar";addMode=false;ui();draw()};
$("bLin").onclick=function(){lin=!lin;if(lin){mode="ver";addMode=false;sel=null;tool="sel";aviso(dicas.sel)}else{fechaLinha();aviso("")}mp=[];cur=[];box=null;selE={};ui();draw()};
["sel","mov","lin","med","esc"].forEach(function(t){$("t"+t[0].toUpperCase()+t.slice(1)).onclick=function(){setTool(t)}});
$("tDel").onclick=apagar;$("tUnd").onclick=desfazer;
$("bAdd").onclick=function(){addMode=!addMode;ui();aviso(addMode?"Toque no ponto da planta onde fica a máquina.":"")};
$("bOk").onclick=function(){sel=null;ui();draw()};
$("bDel").onclick=function(){if(sel&&confirm("Excluir "+sel.nome+"?")){M=M.filter(function(m){return m!==sel});sel=null;save();lista();ui();draw()}};
$("nome").oninput=function(){if(sel&&editando()){sel.nome=this.value;save();draw()}};
$("nome").onchange=lista;
$("bOpen").onclick=function(){$("fil").click()};
function baixar(nome,txt,tipo){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;a.click()}
$("bJson").onclick=function(){baixar("maquinas.json",JSON.stringify(M,null,1),"application/json")};
$("bDxf").onclick=function(){
  var s="0\nSECTION\n2\nENTITIES\n";
  M.forEach(function(m){s+="0\nCIRCLE\n8\nMAQUINAS\n10\n"+m.x+"\n20\n"+m.y+"\n30\n0\n40\n2\n0\nTEXT\n8\nMAQUINAS\n10\n"+(m.x+3)+"\n20\n"+m.y+"\n30\n0\n40\n2\n1\n"+m.nome+"\n"});
  ED.add.forEach(function(it){var p=it.p,st=it.k==="s"?4:2,k;for(k=0;k+3<p.length;k+=st)s+="0\nLINE\n8\nEDICAO\n10\n"+p[k]+"\n20\n"+p[k+1]+"\n30\n0\n11\n"+p[k+2]+"\n21\n"+p[k+3]+"\n31\n0\n"});
  baixar("maquinas.dxf",s+"0\nENDSEC\n0\nEOF\n","application/dxf")};
$("fil").onchange=async function(){
  var f=this.files[0];this.value="";if(!f)return;var n=f.name.toLowerCase();
  try{
    if(n.endsWith(".json")){
      if(!canEdit){aviso("Só quem edita pode importar máquinas.");return}
      var j=JSON.parse(await f.text());M=Array.isArray(j)?j:(j.maquinas||[]);save();lista();draw();return}
    aviso("Lendo "+f.name+"… arquivos grandes podem demorar.");
    await new Promise(function(r){setTimeout(r,40)});
    var buf=await f.arrayBuffer();
    if(n.endsWith(".bin"))usar(parseBIN(buf,mk));
    else{var t=new TextDecoder("utf-8").decode(buf);if(t.indexOf("\uFFFD")>-1)t=new TextDecoder("windows-1252").decode(buf);usar(parseDXF(t,mk))}
  }catch(err){aviso("Não consegui ler esse arquivo.")}
};

// planta guardada no Firestore (protegida pelas regras de acesso)
async function enviar(){
  if(!D||!DB||!canEdit){aviso("Abra primeiro o arquivo da planta (.dxf) e entre como editor.");return}
  if(!confirm("Guardar esta planta no servidor? Ela substitui a anterior."))return;
  aviso("Enviando a planta…");
  try{
    var u=new Uint8Array(D.buf||toBIN(D)),C=700000,n=Math.ceil(u.length/C),i;
    for(i=0;i<n;i++){aviso("Enviando a planta… parte "+(i+1)+" de "+n);await DB.setDoc(DB.doc(DB.fs,"planta","desenho_"+i),{b:DB.Bytes.fromUint8Array(u.slice(i*C,(i+1)*C))})}
    await DB.setDoc(DB.doc(DB.fs,"planta","desenho"),{n:n,em:Date.now()});
    aviso("Planta guardada no servidor ("+n+" partes). Pode sair e entrar para conferir.")
  }catch(e){aviso("Não consegui enviar ("+(e.code||e.message)+"). Confira se o seu e-mail está em editores.")}
}
$("bSend").onclick=enviar;
async function carregaDesenho(){
  aviso("Carregando a planta…");
  var m=await DB.getDoc(DB.doc(DB.fs,"planta","desenho"));
  if(!m.exists()){aviso(canEdit?"Nenhuma planta guardada ainda. Use Abrir arquivo e depois Enviar planta.":"A planta ainda não foi enviada.");return}
  var n=m.data().n,ps=await Promise.all(Array.from({length:n},function(_,i){return DB.getDoc(DB.doc(DB.fs,"planta","desenho_"+i))})),
      parts=ps.map(function(p){return p.data().b.toUint8Array()}),tot=0,o=0;
  parts.forEach(function(p){tot+=p.length});
  var all=new Uint8Array(tot);parts.forEach(function(p){all.set(p,o);o+=p.length});
  usar(parseBIN(all.buffer,mk));
}

// Firebase (login Google + Firestore)
async function iniciaFirebase(){
  var B="https://www.gstatic.com/firebasejs/10.12.2/",
      A=await import(B+"firebase-app.js"),Au=await import(B+"firebase-auth.js"),F=await import(B+"firebase-firestore.js"),
      app=A.initializeApp(FIREBASE),auth=Au.getAuth(app),fs=F.getFirestore(app),unsub=null;
  DB={fs:fs,doc:F.doc,setDoc:F.setDoc,getDoc:F.getDoc,Bytes:F.Bytes};
  $("bLogin").onclick=function(){
    if(auth.currentUser)Au.signOut(auth);
    else Au.signInWithPopup(auth,new Au.GoogleAuthProvider()).catch(function(e){aviso("Não foi possível entrar ("+(e.code||e.message)+").")})};
  Au.onAuthStateChanged(auth,async function(u){
    if(unsub){unsub();unsub=null}
    M=[];canEdit=false;mode="ver";sel=null;D=null;base=null;ED={del:[],add:[],esc:0};selE={};lin=false;lista();ui();draw();
    logado=!!u;$("bLogin").textContent=u?"Sair":"Entrar com Google";
    if(!u){aviso("Entre com o Google para ver as máquinas.");return}
    var mail=(u.email||"").toLowerCase();
    try{var a=await F.getDoc(F.doc(fs,"config","acesso"));
      canEdit=(a.data().editores||[]).map(function(x){return x.toLowerCase()}).indexOf(mail)>-1}
    catch(e){aviso("Sem acesso. Peça ao dono para liberar o e-mail "+mail+".");return}
    aviso("");
    carregaDesenho().catch(function(){aviso("Não consegui carregar a planta.")});
    var u1=F.onSnapshot(F.doc(fs,"planta","maquinas"),function(s){
      if(s.metadata.hasPendingWrites||drag)return;
      M=s.exists()?(s.data().lista||[]):[];lista();draw()},
      function(){aviso("Sem acesso aos dados.")});
    var u2=F.onSnapshot(F.doc(fs,"planta","edicoes"),function(s){
      if(s.metadata.hasPendingWrites)return;
      try{aplicaED(s.exists()?JSON.parse(s.data().j):{del:[],add:[],esc:0})}catch(e){}},function(){});
    unsub=function(){u1();u2()};
    ui();
  });
}

// início
size();
if(FIREBASE){iniciaFirebase().catch(function(){aviso("Erro ao iniciar o login.")});aviso("Entre com o Google para ver as máquinas.")}
else{try{M=JSON.parse(localStorage.getItem("planta_maquinas")||"[]")}catch(e){M=[]}
  try{var e0=JSON.parse(localStorage.getItem("planta_edicoes")||"null");if(e0){e0.del=e0.del||[];e0.add=e0.add||[];ED=e0}}catch(e){}
  lista()}
ui();
if(!FIREBASE){
  aviso("Carregando a planta…");
  fetch("planta.bin").then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()})
    .then(function(b){usar(parseBIN(b,mk))})
    .catch(function(){aviso("Toque em Abrir arquivo e escolha a planta (.dxf).")});
}
