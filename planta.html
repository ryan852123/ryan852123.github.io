<head>

<style>

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

#bar a{color:var(--acc);font-weight:700;text-decoration:none}
button,select,input{font:inherit;color:var(--ink)}
button{background:var(--btn);color:var(--btn-ink);border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;flex:none}
button.on{outline:3px solid var(--acc)}
select,input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
#dock{display:flex;gap:8px;padding:8px 10px;background:var(--bar);border-top:1px solid var(--line);overflow-x:auto;flex:none}
.grp{display:flex;gap:6px;flex:none}
.grp+.grp{padding-left:8px;border-left:1px solid var(--line)}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:62px;padding:6px 8px;font-size:.72rem;font-weight:600;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px}
.tb i{font-style:normal;font-size:1.3rem;line-height:1}
.tb.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.tb.ok{background:var(--btn);color:var(--btn-ink)}
.tb:disabled{opacity:.35}
.sep{width:1px;background:var(--line);margin:0 2px;flex:none}
#tipoAdd{align-self:center;max-width:150px}
#perfilTag{background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;flex:none}

#leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#sel select{flex:none;max-width:42%}
#sel{flex-wrap:wrap}
#sel select{flex:1 1 120px;max-width:none}
#sel #nome{order:2;flex:1 1 100%}
#det,#acoes{order:3}
#det{display:flex;gap:8px;flex-basis:100%;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:2px;font-size:.7rem;color:var(--muted);font-weight:600}
#det input{flex:none;font-size:.85rem}
#fObs{flex:1;min-width:150px}#fObs input{width:100%}
#stTxt{font-size:.85rem;font-weight:700;align-self:center}
#acoes{display:flex;gap:6px;align-items:center;flex-basis:100%;flex-wrap:wrap;font-size:.75rem;color:var(--muted);font-weight:600}
.mini{padding:6px 10px}
#sv{font-size:.75rem;font-weight:700;flex:none;color:var(--muted)}#sv.wait{color:#b45309}#sv.err{color:#c1121f}#sv.ok{color:#15803d}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;z-index:2;display:flex;gap:10px;align-items:center;background:rgba(13,26,49,.95);color:#fff;border-radius:10px;padding:8px 12px;font-size:.85rem;white-space:nowrap;max-width:94%}
#toast button{background:#5ce1ff;color:#06101f;padding:4px 10px}
dialog{background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(5,10,23,.55)}
dialog h3{margin:0 0 8px;font-size:1.05rem}
dialog p{margin:0 0 10px;font-size:.9rem;color:var(--muted)}
dialog input{width:100%}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#dlgN{background:transparent;color:var(--ink);border:1px solid var(--line)}
#dH{border:1px solid var(--line);border-radius:12px;background:var(--bar);color:var(--ink);padding:16px;width:min(520px,92vw)}
#dHl li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem}#dHl small{color:var(--muted)}

#cv{position:absolute;inset:0;touch-action:none;display:block}
#msg{position:absolute;left:10px;right:10px;top:10px;background:var(--bar);border:1px solid var(--acc);border-radius:10px;padding:10px 12px;display:none}
#sel{display:flex;gap:8px;padding:10px;background:var(--bar);border-top:1px solid var(--line);flex:none}

:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

  try{
    if(n.endsWith(".json")){
      if(!canEdit||perfil!=="todos"){aviso("Só quem edita tudo pode importar o backup.");return}
      var j=JSON.parse(await f.text());snap();M=Array.isArray(j)?j:(j.maquinas||[]);save();lista();draw();toast("Backup importado","Desfazer",desfazer);return}
    aviso("Lendo "+f.name+"… arquivos grandes podem demorar.");
    await new Promise(function(r){setTimeout(r,40)});
    var buf=await f.arrayBuffer();
    if(n.endsWith(".bin"))usar(parseBIN(buf,mk));
    else{var t=new TextDecoder("utf-8").decode(buf);if(t.indexOf("\uFFFD")>-1)t=new TextDecoder("windows-1252").decode(buf);usar(parseDXF(t,mk))}
  }catch(err){aviso("Não consegui ler esse arquivo.")}
};

// planta guardada no Firestore (protegida pelas regras de acesso)
async function enviar(){
  if(!D||!DB||!canEdit){aviso("Abra primeiro o arquivo da planta (.dxf) e entre como editor.");return}
  if(!await dialogo("Enviar planta","Guardar esta planta no servidor? Ela substitui a anterior.",null,null,"Enviar"))return;
  aviso("Enviando a planta…");
  try{
    var u=new Uint8Array(D.buf||toBIN(D)),C=700000,n=Math.ceil(u.length/C),i;
    for(i=0;i<n;i++){aviso("Enviando a planta… parte "+(i+1)+" de "+n);await DB.setDoc(DB.doc(DB.fs,"planta","desenho_"+i),{b:DB.Bytes.fromUint8Array(u.slice(i*C,(i+1)*C))})}
    await DB.setDoc(DB.doc(DB.fs,"planta","desenho"),{n:n,em:Date.now()});
    aviso("Planta guardada no servidor ("+n+" partes). Pode sair e entrar para conferir.")
  }catch(e){aviso("Não consegui enviar ("+(e.code||e.message)+"). Confira se o seu e-mail está em editores.")}
}
$("bSend").onclick=enviar;
async function carregaDesenho(){
  aviso("Carregando a planta…");
  var m=await DB.getDoc(DB.doc(DB.fs,"planta","desenho"));
  if(!m.exists()){aviso(canEdit?"Nenhuma planta guardada ainda. Use Abrir arquivo e depois Enviar planta.":"A planta ainda não foi enviada.");return}
  var n=m.data().n,ps=await Promise.all(Array.from({length:n},function(_,i){return DB.getDoc(DB.doc(DB.fs,"planta","desenho_"+i))})),
      parts=ps.map(function(p){return p.data().b.toUint8Array()}),tot=0,o=0;
  parts.forEach(function(p){tot+=p.length});
  var all=new Uint8Array(tot);parts.forEach(function(p){all.set(p,o);o+=p.length});
  usar(parseBIN(all.buffer,mk));
}

// Firebase (login Google + Firestore)
async function iniciaFirebase(){
  var B="https://www.gstatic.com/firebasejs/10.12.2/",
      A=await import(B+"firebase-app.js"),Au=await import(B+"firebase-auth.js"),F=await import(B+"firebase-firestore.js"),
      app=A.initializeApp(FIREBASE),auth=Au.getAuth(app),fs=F.getFirestore(app),unsub=null;
  DB={fs:fs,doc:F.doc,setDoc:F.setDoc,getDoc:F.getDoc,Bytes:F.Bytes,batch:function(){return F.writeBatch(fs)},col:F.collection};
  $("bHist").onclick=async function(){
    try{var r=await F.getDocs(F.query(F.collection(fs,"historico"),F.orderBy("em","desc"),F.limit(60))),ul=$("dHl");ul.innerHTML="";
      if(r.empty){ul.innerHTML="<li>Nenhuma alteração registrada ainda.</li>"}
      r.forEach(function(d){var h=d.data(),li=document.createElement("li"),a=document.createElement("b"),sm=document.createElement("small");
        a.textContent=h.nome+" · "+h.acao;sm.textContent=new Date(h.em).toLocaleString("pt-BR")+" · "+h.por;
        li.appendChild(a);li.appendChild(document.createElement("br"));li.appendChild(sm);ul.appendChild(li)});
      $("dH").showModal()}catch(e){aviso("Sem permissão para ver o histórico.")}};
  $("dHx").onclick=function(){$("dH").close()};
  async function ofereceMigracao(){
    var o=await F.getDoc(F.doc(fs,"planta","maquinas")),l=o.exists()?(o.data().lista||[]):[];
    if(!l.length)return;
    var ok=await dialogo("Migrar para o novo formato","Encontrei "+l.length+" pontos no formato antigo. Copiar para o novo formato, com um registro por ponto e histórico? O documento antigo continua guardado como backup.",null,null,"Migrar");
    if(ok){M=l;migrando=true;save();lista();draw();toast("Migrando "+l.length+" pontos…")}
  }
  $("bLogin").onclick=function(){
    if(auth.currentUser)Au.signOut(auth);
    else Au.signInWithPopup(auth,new Au.GoogleAuthProvider()).catch(function(e){aviso("Não foi possível entrar ("+(e.code||e.message)+").")})};
  Au.onAuthStateChanged(auth,async function(u){
    if(unsub){unsub();unsub=null}
    M=[];Mb={};canEdit=false;mode="ver";sel=null;D=null;base=null;ED={del:[],add:[],esc:0};selE={};lin=false;mede=false;addMode=false;cur=[];mp=[];perfil="todos";filtro="todos";soVenc=false;mostraAlc=false;$("ver").value="todos";montaTipos();lista();ui();draw();
    logado=!!u;$("bLogin").textContent=u?"Sair":"Entrar com Google";
    if(!u){aviso("Entre com o Google para ver as máquinas.");return}
    var mail=(u.email||"").toLowerCase();eu=mail;
    try{var a=await F.getDoc(F.doc(fs,"config","acesso")),d0=a.data(),
        lc=function(l){return (l||[]).map(function(x){return String(x).toLowerCase()})},
        sS=lc(d0.sesmt).indexOf(mail)>-1,sM=lc(d0.manutencao).indexOf(mail)>-1;
      canEdit=lc(d0.editores).indexOf(mail)>-1;
      perfil=sS&&!sM?"sesmt":sM&&!sS?"manut":"todos";montaTipos();lista()}
    catch(e){aviso("Sem acesso. Peça ao dono para liberar o e-mail "+mail+".");return}
    aviso("");
    carregaDesenho().catch(function(){aviso("Não consegui carregar a planta.")});
    var v1=false,v2=false;
    var migrou=false,q=perfil==="sesmt"||perfil==="manut"?F.query(F.collection(fs,"pontos"),F.where("area","==",perfil)):F.collection(fs,"pontos");
    var u1=F.onSnapshot(q,function(s){
      if(s.metadata.hasPendingWrites||dM||drag)return;
      var l=[],mb={},por=null;
      s.forEach(function(d){var o=d.data();o.id=d.id;l.push(o);mb[d.id]=limpo(o)});
      s.docChanges().forEach(function(c){var p=c.doc.data().por;if(p&&p!==eu)por=p});
      if(por&&v1){avisoTemp("Pontos atualizados por "+por+" · o histórico de desfazer foi reiniciado");pilha=[];pilhaR=[];ui()}v1=true;
      M=l;Mb=mb;lista();draw();
      if(s.empty&&canEdit&&perfil==="todos"&&!migrou){migrou=true;ofereceMigracao()}},
      function(){aviso("Sem acesso aos dados.")});
    var u2=F.onSnapshot(F.doc(fs,"planta","edicoes"),function(s){
      if(s.metadata.hasPendingWrites)return;
      var d2=s.exists()?s.data():null;if(d2&&d2.por&&d2.por!==eu&&v2){avisoTemp("Linhas atualizadas por "+d2.por+" · o histórico de desfazer foi reiniciado");pilha=[];pilhaR=[];ui()}v2=true;
      try{aplicaED(s.exists()?JSON.parse(s.data().j):{del:[],add:[],esc:0})}catch(e){}},function(){});
    unsub=function(){u1();u2()};
    ui();
  });
}

// início
montaTipos();
size();
if(window.ResizeObserver){var rq=0;new ResizeObserver(function(){cancelAnimationFrame(rq);rq=requestAnimationFrame(function(){size();if(D){base=null;renderBase()}else draw()})}).observe($("stage"))}
if(FIREBASE){iniciaFirebase().catch(function(){aviso("Erro ao iniciar o login.")});aviso("Entre com o Google para ver as máquinas.")}
else{try{M=JSON.parse(localStorage.getItem("planta_maquinas")||"[]")}catch(e){M=[]}
  try{var e0=JSON.parse(localStorage.getItem("planta_edicoes")||"null");if(e0){e0.del=e0.del||[];e0.add=e0.add||[];ED=e0}}catch(e){}
  lista()}
ui();
if(!FIREBASE){
  aviso("Carregando a planta…");
  fetch("planta.bin").then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()})
    .then(function(b){usar(parseBIN(b,mk))})
    .catch(function(){aviso("Toque em Abrir arquivo e escolha a planta (.dxf).")});
}
